name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release
      - name: Size check (under 1 MB)
        shell: pwsh
        run: |
          $size = (Get-Item target/release/hold.exe).Length
          Write-Host "hold.exe is $size bytes"
          if ($size -ge 1MB) { throw "hold.exe is over 1 MB" }
