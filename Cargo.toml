[package]
name = "hold"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Keeps Windows awake from the system tray"
repository = "https://github.com/Punk-Science-Studios-Inc/hold"

[dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_Graphics_Gdi",
]

[build-dependencies]
embed-resource = "=3.0.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
